<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telas do vídeo</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0F1C; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Motor das telas: cada cena é uma função do tempo local t (segundos). Tudo é desenhado no canvas,
// quadro a quadro, para o render ser determinístico. Dados e plano chegam por window.DADOS e window.PLANO.
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const COR = { fundo: '#0A0F1C', texto: '#E8ECF4', fraco: '#8A94A7', lula: '#E5484D', flavio: '#3B82F6',
              destaque: '#F5C451', linha: 'rgba(255,255,255,0.08)', cartao: 'rgba(255,255,255,0.05)' };
const FONTE = 'Inter';

// ---------- utilidades ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const fase = (t, ini, dur) => clamp((t - ini) / dur);
const suave = x => x * x * (3 - 2 * x);
const saida = x => 1 - Math.pow(1 - x, 3);
const mistura = (a, b, k) => a + (b - a) * k;
let ALFA = 1;  // multiplicador de opacidade dos textos e caixas (transições)
let LD = 0, NUM = null;  // versões curtas: deslocamento dos índices de legenda e número da pergunta
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function texto(s, x, y, tam, cor, peso = 700, alinhar = 'center', alfa = 1) {
  g.save(); g.globalAlpha = alfa * ALFA; g.fillStyle = cor; g.font = `${peso} ${tam}px ${FONTE}`;
  g.textAlign = alinhar; g.textBaseline = 'middle'; g.fillText(s, x, y); g.restore();
}
function quebrar(s, larg, tam, peso) {
  g.font = `${peso} ${tam}px ${FONTE}`; const pal = s.split(' '); const linhas = []; let l = '';
  for (const p of pal) { const t = l ? l + ' ' + p : p; if (g.measureText(t).width > larg && l) { linhas.push(l); l = p; } else l = t; }
  if (l) linhas.push(l); return linhas;
}
function paragrafo(s, x, y, larg, tam, cor, peso = 600, alfa = 1, entrelinha = 1.25, alinhar = 'center') {
  const ls = quebrar(s, larg, tam, peso);
  ls.forEach((l, i) => texto(l, x, y + i * tam * entrelinha, tam, cor, peso, alinhar, alfa));
  return ls.length * tam * entrelinha;
}
function caixa(x, y, w, h, r, cor, alfa = 1, borda = null) {
  g.save(); g.globalAlpha = alfa * ALFA; g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = cor; g.fill();
  if (borda) { g.strokeStyle = borda; g.lineWidth = 2; g.stroke(); } g.restore();
}
// L(n, reserva): início, em segundos da cena, da legenda n; sincroniza a animação com a fala
const L = (n, reserva) => (window.CENA && window.CENA.legenda && window.CENA.legenda[n + LD]) ? window.CENA.legenda[n + LD][0] : reserva;
const fmt = (n, casas = 0) => n.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });

function fundo(t) {
  g.fillStyle = COR.fundo; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W / 2, 760, 60, W / 2, 760, 1100);
  rg.addColorStop(0, 'rgba(59,130,246,0.10)'); rg.addColorStop(1, 'rgba(10,15,28,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.strokeStyle = COR.linha; g.lineWidth = 1;
  const desl = (t * 6) % 60;
  for (let x = -60 + desl; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = -60 + desl; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  texto('ELEIÇÃO 2026 · 2º TURNO', 60, 96, 30, COR.fraco, 700, 'left');
  g.fillStyle = COR.destaque; g.fillRect(60, 124, 72, 6);
}
function rodape(s, alfa = 1) { if (s) paragrafo('Fonte: ' + s, W / 2, 1838, 960, 24, COR.fraco, 500, 0.85 * alfa); }

// ---------- fotos ----------
const FOTOS = {};
window.carregarFotos = async function () {
  for (const c of window.PLANO.cenas) if (c.foto && !FOTOS[c.foto.arquivo]) {
    const im = new Image(); im.src = c.foto.arquivo; await im.decode(); FOTOS[c.foto.arquivo] = im;
  }
};
// ---------- mapa de pontos ----------
let PONTOS = null;
function prepararMapa() {
  const cid = window.DADOS.cidades;
  const lat0 = -15 * Math.PI / 180, kx = Math.cos(lat0);
  let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
  const brutos = cid.map(c => { const x = c[1] * kx, y = -c[0]; xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y); return [x, y, c]; });
  const larg = 800, esc = larg / (xmax - xmin), alt = (ymax - ymin) * esc;
  const ox = (W - larg) / 2, oy = 370;
  window.MAPA_FIM = oy + alt;
  let semente = 7; const aleat = () => (semente = (semente * 16807) % 2147483647) / 2147483647;
  PONTOS = brutos.map(([x, y, c]) => ({ x: ox + (x - xmin) * esc, y: oy + (y - ymin) * esc, quem: c[2], flavio1t: c[3], margem: c[6], ordem: aleat() }));
}
function mapa(t, opc) {
  // opc: aparecer (0..1), colorir (0..1), focoRedutos (0..1), porMargem (0..1: redutos coloridos pela margem em pontos), alfa
  if (!PONTOS) prepararMapa();
  const a = opc.alfa ?? 1;
  for (const p of PONTOS) {
    const vis = clamp((opc.aparecer - p.ordem * 0.85) / 0.15);
    if (vis <= 0) continue;
    let cor = '#C9D1E0', al = 0.55;
    const k = clamp((opc.colorir - p.ordem * 0.5) / 0.5);
    const quem = (opc.porMargem > p.ordem && p.flavio1t >= 65) ? p.margem : p.quem;
    if (k > 0) { cor = quem === 1 ? COR.lula : (quem === -1 ? COR.flavio : '#C9D1E0'); al = mistura(0.55, 0.9, k); }
    if (opc.focoRedutos) { const reduto = p.flavio1t >= 65; al *= reduto ? 1 : mistura(1, 0.12, opc.focoRedutos); }
    g.globalAlpha = al * vis * a; g.fillStyle = k > 0.5 ? cor : '#C9D1E0';
    if (k > 0 && k <= 0.5) g.fillStyle = cor;
    g.beginPath(); g.arc(p.x, p.y, opc.raio ?? 3.4, 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}

// ---------- elementos ----------
function cartao(x, y, w, h, t0, t, titulo, corpo, corBarra) {
  const k = saida(fase(t, t0, 0.6)); if (k <= 0) return;
  const dx = (1 - k) * 80;
  caixa(x + dx, y, w, h, 28, COR.cartao, k, 'rgba(255,255,255,0.10)');
  g.save(); g.globalAlpha = k * ALFA; g.fillStyle = corBarra; g.fillRect(x + dx, y + 26, 10, h - 52); g.restore();
  texto(titulo, x + dx + 50, y + 66, 60, COR.texto, 800, 'left', k);
  paragrafo(corpo, x + dx + 50, y + 132, w - 100, 34, COR.fraco, 500, k, 1.3, 'left');
}
function cartaoPartes(x, y, w, h, t0, t, titulo, partes, corBarra) {
  const k = saida(fase(t, t0, 0.6)); if (k <= 0) return;
  const dx = (1 - k) * 80;
  caixa(x + dx, y, w, h, 28, COR.cartao, k, 'rgba(255,255,255,0.10)');
  g.save(); g.globalAlpha = k * ALFA; g.fillStyle = corBarra; g.fillRect(x + dx, y + 26, 10, h - 52); g.restore();
  texto(titulo, x + dx + 50, y + 66, 60, COR.texto, 800, 'left', k);
  partes.forEach(([s, tp], i) => texto(s, x + dx + 50, y + 132 + i * 44, 34, COR.fraco, 500, 'left', k * saida(fase(t, tp, 0.5))));
}
function contador(valor, casas, t, t0, dur) { return valor * saida(fase(t, t0, dur)); }
function pergunta(s, t, t0, y = 960, tam = 84) {
  const k = saida(fase(t, t0, 0.7)); if (k <= 0) return;
  g.save(); g.translate(W / 2, y); g.scale(mistura(0.92, 1, k), mistura(0.92, 1, k)); g.translate(-W / 2, -y);
  paragrafo(s, W / 2, y - tam * 0.6, 900, tam, COR.texto, 800, k, 1.15); g.restore();
}
function selo(s, x, y, t, t0, cor = COR.destaque) {
  const k = saida(fase(t, t0, 0.5)); if (k <= 0) return;
  g.font = `800 34px ${FONTE}`; const w = g.measureText(s).width + 60;
  caixa(x - w / 2, y - 34, w, 68, 34, rgba(cor, 0.16), k, rgba(cor, 0.8));
  texto(s, x, y + 1, 34, cor, 800, 'center', k);
}
function rotuloDuvida(n, t) {
  const k = saida(fase(t, 0, 0.5));
  caixa(60, 190, 330, 70, 35, rgba(COR.destaque, 0.15), k, rgba(COR.destaque, 0.9));
  texto(`PERGUNTA ${NUM ?? n}`, 225, 226, 32, COR.destaque, 800, 'center', k);
}

// ---------- cenas ----------
const CENAS = {
  abertura(t, d) {
    const k = t < 1 / 30 ? 1 : saida(fase(t, 0.2, 1.6)), m = suave(fase(t, 2.3, 1.0));
    const kh = 1 - suave(fase(t, d - 0.4, 0.4));
    texto(fmt(Math.round(5571 * k)), W / 2, mistura(820, 232, m), mistura(200, 84, m), COR.texto, 900, 'center', kh);
    texto('cidades', W / 2, mistura(960, 302, m), mistura(64, 34, m), COR.fraco, 600, 'center', kh);
    mapa(t, { aparecer: fase(t, 2.9, Math.max(1.5, d - 4.5)), colorir: 0 });
    rodape('TSE, totais do 2º turno por município');
  },
  contexto(t, d) {
    mapa(t, { aparecer: 1, colorir: 0, alfa: mistura(1, 0.07, suave(fase(t, 0, 0.6))) });
    ALFA = 1 - fase(t, d - 0.4, 0.4);  // os cartões somem antes do mapa voltar
    cartao(60, 300, 960, 250, L(1, 2.4) - 0.2, t, '+2,2 milhões', 'Flávio venceu o 1º turno com 2,2 milhões de votos de vantagem', COR.flavio);
    cartaoPartes(60, 574, 960, 300, L(2, d * 0.17) - 0.2, t, 'PL: 121 deputados', [
      ['e deve começar com 29 dos 81 senadores', L(3, d * 0.27) - 0.2],
      ['as maiores bancadas de um partido desde 1988', L(4, d * 0.38) - 0.2],
      ['com a direita, mais da metade do Senado', L(6, d * 0.5) - 0.2]], COR.flavio);
    cartaoPartes(60, 898, 960, 270, L(7, d * 0.63) - 0.2, t, '12 de 21', [
      ['governadores eleitos no 1º turno apoiaram Flávio;', L(7, d * 0.63) - 0.2],
      ['e também Zema, Caiado, Cury e Temer', L(9, d * 0.76) - 0.2]], COR.flavio);
    cartao(60, 1192, 960, 270, L(10, d * 0.85) - 0.2, t, '11 de 12', 'institutos com Flávio numericamente à frente na última pesquisa (50,1% a 52% dos válidos)', COR.flavio);
    ALFA = 1;
    rodape('TSE; Agência Brasil e Agência Senado (bancadas); apoios e pesquisas divulgados na imprensa');
  },
  mapa(t, d) {
    const tcMapa = L(1, 2.4) + 2.6, tr = L(6, d * 0.6) - 0.3;
    const kFim = 1 - suave(fase(t, d - 0.45, 0.45));  // termina no estado em que a cena 3 começa
    const kE = (window.CENA && window.CENA.tipo === 'mapa3') ? saida(fase(t, L(11, d * 0.9) - 0.2, 0.5)) : 0;
    const foco = suave(fase(t, tr, 1.2)) * kFim;
    mapa(t, { aparecer: 1, colorir: fase(t, tcMapa, 2.2), focoRedutos: foco, porMargem: foco, alfa: mistura(0.07, 1, suave(fase(t, 0, 0.6))) * mistura(0.22, 1, kFim) });
    ALFA = kFim * (1 - kE);
    const k1 = saida(fase(t, L(2, 7.4) - 0.2, 0.8)), kSai = 1 - suave(fase(t, tr, 0.4)), k2 = suave(fase(t, tr + 0.4, 0.6));
    const yb = 1250, a1 = k1 * kSai;
    caixa(60, yb, 960, 330, 32, 'rgba(10,15,28,0.82)', a1, 'rgba(255,255,255,0.10)');
    texto(fmt(Math.round(contador(5228, 0, t, L(2, 7.4) - 0.2, 1.6))) + ' cidades', W / 2, yb + 80, 76, COR.lula, 900, 'center', a1);
    texto('94% das cidades: Lula cresceu mais que Flávio', W / 2, yb + 160, 34, COR.texto, 600, 'center', a1 * saida(fase(t, L(3, 9.6) - 0.2, 0.5)));
    const t67 = L(5, 13.3) - 0.2;
    texto('saldo de Lula nelas: +' + fmt(contador(6.7, 1, t, t67, 1.6), 1) + ' milhões', W / 2, yb + 240, 44, COR.texto, 800, 'center', a1 * saida(fase(t, t67, 0.4)));
    caixa(60, yb, 960, 330, 32, 'rgba(10,15,28,0.82)', k2, 'rgba(255,255,255,0.10)');
    texto('Redutos de Flávio', W / 2, yb + 70, 44, COR.flavio, 800, 'center', k2);
    texto('(mais de 65% no 1º turno)', W / 2, yb + 122, 32, COR.fraco, 600, 'center', k2);
    texto('a virada ali foi menor: 2,5 pontos, contra 4,4 na média', W / 2, yb + 190, 30, COR.fraco, 600, 'center', k2 * saida(fase(t, L(8, d * 0.73) - 0.2, 0.5)));
    const t89 = L(9, d * 0.8) - 0.2, tN = L(10, d * 0.9) - 0.2;
    g.font = `900 48px ${FONTE}`; const pre = 'margem foi para Lula ', pos = 'em 89% delas', xm = W / 2 - g.measureText(pre + pos).width / 2;
    texto(pre, xm, yb + 262, 48, COR.lula, 900, 'left', k2 * saida(fase(t, t89, 0.5)));
    texto(pos, xm + g.measureText(pre).width, yb + 262, 48, COR.lula, 900, 'left', k2 * saida(fase(t, tN, 0.5)));
    // legenda de cores: até os redutos, quem ganhou mais votos; nos redutos, para onde andou a margem
    const kl = saida(fase(t, tcMapa, 0.8)), rSai = suave(fase(t, tr, 0.3)), rEnt = suave(fase(t, tr + 0.3, 0.3));
    g.globalAlpha = kl * ALFA; g.fillStyle = COR.lula; g.beginPath(); g.arc(230, 300, 12, 0, 6.28); g.fill();
    g.fillStyle = COR.flavio; g.beginPath(); g.arc(620, 300, 12, 0, 6.28); g.fill(); g.globalAlpha = 1;
    texto('Lula cresceu mais', 255, 300, 28, COR.texto, 600, 'left', kl * (1 - rSai));
    texto('Flávio cresceu mais', 645, 300, 28, COR.texto, 600, 'left', kl * (1 - rSai));
    texto('margem foi para Lula', 255, 300, 28, COR.texto, 600, 'left', kl * rEnt);
    texto('margem foi para Flávio', 645, 300, 28, COR.texto, 600, 'left', kl * rEnt);
    ALFA = kFim;
    if (kE > 0) {  // destaque: 94% andando juntas
      caixa(60, 1250, 960, 330, 32, 'rgba(10,15,28,0.9)', kE, rgba(COR.destaque, 0.8));
      texto('94% das cidades', W / 2, 1335, 70, COR.texto, 900, 'center', kE);
      texto('andaram juntas para o mesmo lado', W / 2, 1410, 40, COR.texto, 700, 'center', kE);
      texto('Para mim, isso é muito estranho.', W / 2, 1500, 50, COR.destaque, 900, 'center', kE);
    }
    ALFA = 1;
    rodape('TSE, totais por município do 1º e do 2º turno (5.571 cidades); margem em pontos dos votos válidos');
  },
  pergunta(t, d) {
    mapa(t, { aparecer: 1, colorir: 1, alfa: 0.22 });
    pergunta('De onde veio esse movimento?', t, L(1, 1.8) - 0.2, 980, 96);
  },
  conta(t, d) {
    const blocos = [['Votos dos derrotados', 9.32], ['Aumento do comparecimento', 2.96], ['Queda do branco e nulo', 1.82]];
    blocos.forEach(([nome, v], i) => {
      const k = saida(fase(t, L(1 + i, 0.3 + i * 1.8) - 0.2, 0.6)); const y = 360 + i * 150 - (1 - k) * 60;
      caixa(90, y, 900, 124, 26, COR.cartao, k, 'rgba(255,255,255,0.10)');
      texto(nome, 140, y + 62, 36, COR.texto, 600, 'left', k);
      texto(fmt(v, 2) + ' mi', 950, y + 62, 50, COR.destaque, 900, 'right', k);
    });
    const kt = saida(fase(t, L(4, 5.7) - 0.2, 0.6));
    g.globalAlpha = kt; g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(90, 820, 900, 3); g.globalAlpha = 1;
    texto('14,1 milhões em jogo', W / 2, 880, 56, COR.texto, 900, 'center', kt);
    // barra: Flávio (3,72) e o restante (10,38) dividido nas três partes
    const tf = L(5, 7.3) - 0.2, x0 = 90, lg = 900, y0 = 990, alt = 110, tot = 14.10;
    const kf = suave(fase(t, tf, 1.0));
    caixa(x0, y0, lg, alt, 18, 'rgba(255,255,255,0.06)', kt);
    const wf = lg * 3.72 / tot;
    if (kf > 0) {
      caixa(x0, y0, wf * kf, alt, 18, COR.flavio, 1);
      texto('Flávio +3,72 mi', x0 + 10, y0 + alt + 46, 34, COR.flavio, 800, 'left', kf);
      texto('equivale a 40% dos derrotados', x0 + 10, y0 + alt + 88, 28, COR.fraco, 600, 'left', saida(fase(t, L(6, tf + 2.8) - 0.2, 0.6)));
    }
    const partes = [['outros 60% dos derrotados', 5.60, 1.0], ['aumento do comparecimento', 2.96, 0.78], ['queda do branco e nulo', 1.82, 0.58]];
    let x = x0 + wf; const tl = L(7, tf + 2.4);
    partes.forEach(([nome, v, a], i) => {
      const k = suave(fase(t, L(8 + i, tl + i * 1.1) - 0.2, 0.8)); const w = lg * v / tot;
      if (k > 0) {
        caixa(x, y0, w * k, alt, 6, COR.lula, a);
        texto(fmt(v, 2), x + w / 2, y0 + alt / 2, 30, '#FFFFFF', 800, 'center', clamp((k - 0.5) / 0.5));
        const rot = fmt(v, 2) + ' mi: ' + nome, yr = y0 + alt + 128 + i * 40;
        g.font = `600 28px ${FONTE}`; const lr = g.measureText(rot).width;
        caixa(x0 + lg - lr - 34, yr - 11, 22, 22, 4, COR.lula, a * k);
        texto(rot, x0 + lg, yr, 28, COR.texto, 600, 'right', k);
      }
      x += w;
    });
    const k100 = saida(fase(t, L(11, tl + 3.6) - 0.2, 0.7));
    texto('Lula +10,38 mi', x0 + lg, y0 + alt + 46, 34, COR.lula, 800, 'right', k100);
    if (k100 > 0) {
      g.save(); g.translate(W / 2, 1405); const e = mistura(1.25, 1, k100); g.scale(e, e); g.translate(-W / 2, -1405);
      texto('100% do restante', W / 2, 1405, 92, COR.lula, 900, 'center', k100); g.restore();
    }
    selo('pelo saldo, não por eleitor', W / 2, 1500, t, L(12, tl + 4.5) - 0.2);
    rodape('TSE; pelo saldo: 3,72 + 10,38 = 9,32 + 2,96 + 1,82 (14,1 mi)');
  },
  base(t, d) {
    rotuloDuvida(1, t);
    const k1 = saida(fase(t, L(3, d * 0.24) - 0.2, 0.7)), k2 = saida(fase(t, L(4, d * 0.35) - 0.2, 0.7)), k3 = saida(fase(t, L(5, d * 0.62) - 0.2, 0.7));
    function coluna(x, nome, cor, pct, corDest, k) {
      caixa(x, 360, 440, 520, 30, COR.cartao, k, 'rgba(255,255,255,0.10)');
      texto(nome, x + 220, 410, 34, COR.texto, 700, 'center', k); texto('no 1º turno', x + 220, 452, 34, COR.texto, 700, 'center', k);
      texto(fmt(pct, 1).replace(',0', '') + '%', x + 220, 650, 120, corDest, 900, 'center', k);
      texto(cor, x + 220, 750, 32, COR.fraco, 600, 'center', k); texto('no saldo (estimativa)', x + 220, 792, 32, COR.fraco, 600, 'center', k);
    }
    const kA = saida(fase(t, L(1, 1.4) - 0.2, 0.6)) * (1 - saida(fase(t, L(3, d * 0.24) - 0.6, 0.4)));
    texto('amostra de 3.897 seções', W / 2, 620, 60, COR.texto, 800, 'center', kA);
    coluna(80, 'Base de Flávio', 'perdida para Lula,', 5.0, COR.lula, k1);
    coluna(560, 'Base de Lula', 'perdida para Flávio,', 1.1, COR.flavio, k2);
    caixa(80, 940, 920, 170, 30, rgba(COR.destaque, 0.10), k3, rgba(COR.destaque, 0.7));
    texto('Nas pesquisas: perdas parecidas', W / 2, 1000, 48, COR.destaque, 800, 'center', k3);
    texto('PoderData, 23 e 24/10: cada lado perdia 5% para o outro', W / 2, 1062, 30, COR.fraco, 600, 'center', k3);

    texto('de forma independente do software', W / 2, 556, 38, COR.texto, 700, 'center', saida(fase(t, L(6, d * 0.55) - 0.2, 0.5)));
  }
  const kO = saida(fase(t, L(iMundo, d * 0.65) - 0.2, 0.6));
  texto('No mundo de hoje, não dá para confiar', W / 2, 760, 46, COR.texto, 800, 'center', kO);
  texto('de olhos fechados em software nenhum.', W / 2, 818, 46, COR.texto, 800, 'center', kO);
  // C: o pedido final
  const kC = saida(fase(t, L(iFinal, d * 0.85) - 0.2, 0.7));
  caixa(60, 1040, 960, 300, 32, rgba(COR.destaque, 0.10), kC, rgba(COR.destaque, 0.8));
  const fim = literal ? ['O voto precisa ser', 'auditável de verdade.'] : ['O voto precisa poder ser conferido', 'sem depender só do software.'];
  fim.forEach((l, i) => texto(l, W / 2, 1150 + i * 66, literal ? 60 : 52, COR.destaque, 900, 'center', kC));
  rodape('análise com critérios registrados antes de ver os dados; boletim, RDV e log publicados pelo TSE');
}

// fechamento da rodada 2: conta x voto, sem voto impresso (A ou B), recapitulação em tópicos e o "estranho"
function fechamentoRecap(t, d, literal) {
  const iQ = literal ? 8 : 9, iM = literal ? 12 : 13;
  const tB = L(6, d * 0.4) - 0.3, sai = 1 - suave(fase(t, tB, 0.6));
  mapa(t, { aparecer: 1, colorir: 1, alfa: 0.35 * sai });
  const kA = saida(fase(t, 0.4, 0.8)) * sai;
  caixa(60, 1140, 960, 360, 32, 'rgba(10,15,28,0.88)', kA, 'rgba(255,255,255,0.10)');
  texto('13 municípios com todos os boletins somados', W / 2, 1190, 38, COR.texto, 800, 'center', kA);
  texto('a soma bate com o total, e nenhum teste meu achou fraude', W / 2, 1243, 30, COR.fraco, 600, 'center', kA * saida(fase(t, L(1, 3.0) - 0.2, 0.6)));
  texto('Isso confere a conta, não o voto.', W / 2, 1320, 46, COR.destaque, 900, 'center', kA * saida(fase(t, L(3, d * 0.2) - 0.2, 0.6)));
  const k4 = kA * saida(fase(t, L(4, d * 0.27) - 0.2, 0.6));
  texto('Não dá para afirmar com 100% de certeza', W / 2, 1395, 34, COR.texto, 700, 'center', k4);
  texto('que nada aconteceu dentro da urna.', W / 2, 1440, 34, COR.texto, 700, 'center', k4);
  // sem voto impresso
  const kS = saida(fase(t, L(6, d * 0.4) - 0.2, 0.6)) * (1 - suave(fase(t, L(iQ, d * 0.6) - 0.5, 0.5)) * 0.35);
  caixa(60, 300, 960, literal ? 230 : 270, 32, 'rgba(10,15,28,0.88)', kS, 'rgba(255,255,255,0.10)');
  texto('Sem voto impresso', W / 2, 370, 56, COR.destaque, 900, 'center', kS);
  if (literal) texto('a urna não pode ser auditada', W / 2, 460, 46, COR.texto, 800, 'center', kS * saida(fase(t, L(7, d * 0.45) - 0.2, 0.5)));
  else {
    texto('a urna não permite conferir o voto real', W / 2, 450, 36, COR.texto, 700, 'center', kS * saida(fase(t, L(7, d * 0.45) - 0.2, 0.5)));
    texto('de forma independente do software', W / 2, 500, 36, COR.texto, 700, 'center', kS * saida(fase(t, L(8, d * 0.52) - 0.2, 0.5)));
  }
  // recapitulação em tópicos
  const tQ = L(iQ, d * 0.6) - 0.2;
  const topicos = ['Flávio na frente: 1º turno, PL recorde, apoios, pesquisas', '94% das cidades andaram juntas para Lula, até nos redutos',
                   'A conta: Lula precisaria de 100% do restante', '1 em cada 20 eleitores de Flávio foi para Lula (estimativa)',
                   'Votação prorrogada e totalização suspensa'];
  topicos.forEach((s, i) => {
    const k = saida(fase(t, tQ + i * 0.9, 0.5)); const y = 640 + i * 78;
    g.globalAlpha = k * ALFA; g.fillStyle = COR.destaque; g.beginPath(); g.arc(98, y, 9, 0, 6.28); g.fill(); g.globalAlpha = 1;
    paragrafo(s, 124, y, 880, 28, COR.texto, 700, k, 1.2, 'left');
  });
  // o fecho
  const kM = saida(fase(t, L(iM, d * 0.85) - 0.2, 0.6)), kE = saida(fase(t, L(iM + 1, d * 0.92) - 0.2, 0.6));
  caixa(60, 1080, 960, 330, 32, rgba(COR.destaque, 0.10), kM, rgba(COR.destaque, 0.8));
  texto('No mínimo, é estranho.', W / 2, 1185, 66, COR.destaque, 900, 'center', kM);
  texto('E muita coisa precisa ser explicada.', W / 2, 1290, 44, COR.texto, 800, 'center', kE);
  rodape('análise com critérios registrados antes de ver os dados; boletim, RDV e log publicados pelo TSE');
}

// legenda: lista de [inicio, fim, texto] em segundos da cena
function legenda(t, itens) {
  // a primeira legenda vale desde o início da cena, para a caixa não piscar na troca de cena
  const it = itens && itens.find((c, i) => t >= (i === 0 ? 0 : c[0]) && t < c[1]); if (!it) return;
  const s = it[2].replace(/(\d) (?=mil|milh|pontos|senadores|deputados|cidades|institutos|governadores)/g, '$1\u00a0')  // número fica com a unidade
                 .replace(/(\d+) (dos|de) (?=\d)/g, '$1\u00a0$2\u00a0');
  let ls = quebrar(s, 900, 44, 700);
  if (ls.length === 2) {  // equilibra as duas linhas: o corte que deixa a linha mais longa o mais curta possível
    g.font = `700 44px ${FONTE}`; const pal = s.split(' '); let mw = 1e9;
    const fraca = /^(a|o|as|os|um|uma|uns|de|do|da|dos|das|em|no|na|com|por|para|que|e|ou|sua|seu|eu)$/i;
    for (let i = 1; i < pal.length; i++) {
      const a = pal.slice(0, i).join(' '), b = pal.slice(i).join(' '), m = Math.max(g.measureText(a).width, g.measureText(b).width);
      const custo = m + (fraca.test(pal[i - 1]) ? 150 : 0) - (/[,:;]$/.test(pal[i - 1]) ? 150 : 0);
      if (m <= 900 && custo < mw) { mw = custo; ls = [a, b]; }
    }
  }
  const h = ls.length * 56 + 36; const y = 1690 - h / 2;
  caixa(70, y, 940, h, 22, 'rgba(0,0,0,0.62)', 1);
  ls.forEach((l, i) => texto(l, W / 2, y + 18 + 28 + i * 56, 44, '#FFFFFF', 700));
}

window.desenhar = function (indice, t) {
  const c = window.PLANO.cenas[indice]; window.CENA = c; ALFA = 1; LD = 0; NUM = null;
  const tg = window.PLANO.cenas.slice(0, indice).reduce((s, x) => s + Math.round(x.duracao * 30) / 30, 0);
  fundo(tg + t);
  CENAS[c.tipo](t, c.duracao);
  legenda(t, c.legenda);
  return true;
};
